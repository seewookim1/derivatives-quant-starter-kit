version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: hdesk-db
    environment:
      POSTGRES_USER: hdesk
      POSTGRES_PASSWORD: hdesk_secret
      POSTGRES_DB: hdesk_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdesk -d hdesk_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hdesk-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    container_name: hdesk-api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://hdesk:hdesk_secret@timescaledb:5432/hdesk_db
      DATABASE_URL_SYNC: postgresql+psycopg2://hdesk:hdesk_secret@timescaledb:5432/hdesk_db
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn hdesk.api.main:app --host 0.0.0.0 --port 8000 --reload

  dashboard:
    build:
      context: ..
      dockerfile: docker/dashboard/Dockerfile
    container_name: hdesk-dashboard
    env_file:
      - ../.env
    environment:
      API_URL: http://api:8000
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/src
    ports:
      - "8050:8050"
    volumes:
      - ../src:/app/src
    depends_on:
      - api
    command: python -m hdesk.dashboard.app

  worker:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    container_name: hdesk-worker
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://hdesk:hdesk_secret@timescaledb:5432/hdesk_db
      DATABASE_URL_SYNC: postgresql+psycopg2://hdesk:hdesk_secret@timescaledb:5432/hdesk_db
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/src
    volumes:
      - ../src:/app/src
      - ../reports:/app/reports
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m hdesk.workers.scheduler

volumes:
  pgdata:
