[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdesk"
version = "0.1.0"
description = "Derivatives Hedge Desk Quant Starter Kit"
requires-python = ">=3.9,<3.10"

dependencies = [
    # 수치 계산
    "numpy>=1.24,<2.0",
    "scipy>=1.9,<2.0",
    "numba>=0.57,<0.60",
    "pandas>=1.5,<3.0",

    # 옵션 프라이싱
    "QuantLib>=1.30",
    "py_vollib>=1.0",
    "py_lets_be_rational>=1.0",

    # 데이터베이스
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg2-binary>=2.9,<3.0",
    "asyncpg>=0.29,<1.0",

    # API 프레임워크
    "fastapi>=0.100,<1.0",
    "uvicorn[standard]>=0.23,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0",

    # Redis / 실시간
    "redis[asyncio]>=5.0,<6.0",

    # 대시보드
    "dash>=2.14,<3.0",
    "dash-bootstrap-components>=1.5,<2.0",
    "dash-extensions>=1.0,<2.0",
    "plotly>=5.18,<6.0",

    # 배치 스케줄러
    "APScheduler>=3.10,<4.0",

    # 통계
    "statsmodels>=0.14,<1.0",
    "arch>=6.0,<8.0",

    # 유틸리티
    "openpyxl>=3.1,<4.0",
    "tenacity>=8.0,<10.0",
    "structlog>=24.0,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
    "coverage>=7.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.5",
]

bloomberg = [
    "blp>=0.0.3",
    "xlwings>=0.30",
]

[project.scripts]
hdesk-api    = "hdesk.api.main:run"
hdesk-dash   = "hdesk.dashboard.app:run"
hdesk-worker = "hdesk.workers.scheduler:run"
hdesk-initdb = "scripts.init_db:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py39"]
